<ion-app>
  <!-- Menü hep var olsun ama içi duruma göre yüklensin -->
  <ion-menu menuId="mainMenu" contentId="main-content" type="overlay">
    <ion-content>
      @if(isLoggedIn) {
        <ion-list id="labels-list">
          <ion-list-header>{{'BOSPHORE_MENU' | translate}}</ion-list-header>
          @for (p of appPages; track p.url) {
            <ion-menu-toggle auto-hide="false">
              <ion-item [routerLink]="p.url" routerDirection="root" lines="none">
                <ion-icon slot="start" [name]="p.icon + '-outline'"></ion-icon>
                <ion-label>{{ p.title | translate }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }

          <!-- 🟢 KALICI ÇIKIŞ YAP BUTONU -->
          <ion-menu-toggle auto-hide="false">
            <ion-item (click)="logout()" lines="none" detail="false" style="--color: #eb445a; cursor: pointer; font-weight: bold; margin-top: 15px;">
              <ion-icon slot="start" name="log-out-outline"></ion-icon>
              <ion-label>{{ 'LOG_OUT' | translate }}</ion-label>
            </ion-item>
          </ion-menu-toggle>

        </ion-list>
      }
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
