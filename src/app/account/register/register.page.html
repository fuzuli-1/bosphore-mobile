<ion-content class="ion-padding auth-bg">
  <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
    <div class="register-container">
      <div class="header-section ion-text-center">
        <img src="assets/img/bosphore_logo.svg" class="mini-logo" alt="Bosphore Logo" height="100"  />
        <h1 class="ion-no-margin">{{'BECAME_MEMBER'|translate}}</h1>
      </div>

      <div class="form-content">
        <div class="input-group">
          <label>{{'PHONE_NUMBER'|translate}}</label>
          <ion-input 
           formControlName="phoneNumber"
           type="tel" placeholder="5XXXXXXXXX" mode="md" fill="outline">

          </ion-input>
        </div>

        <div class="row">
          <div class="input-group">
            <label>{{'FIRST_NAME'|translate}}</label>
            <ion-input formControlName="firstName" type="text" 
            [placeholder]="'FIRST_NAME_PLACEHOLDER' | translate"
             mode="md" fill="outline"></ion-input>
          </div>
          <div class="input-group">
            <label>{{'LAST_NAME'|translate}}</label>
            <ion-input formControlName="lastName" type="text" placeholder="{{'LAST_NAME_PLACEHOLDER'|translate}}" mode="md" fill="outline"></ion-input>
          </div>
        </div>

        <div class="input-group">
          <label>{{'EMAIL_ADDRESS'|translate}} ({{'OPTIONAL'|translate}})</label>
          <ion-input formControlName="email" type="email" placeholder="{{'EMAIL_PLACEHOLDER'|translate}}" mode="md" fill="outline"></ion-input>
        </div>
        <div class="input-group">
          <label>{{'PASSWORD'|translate}}</label>
          <div class="password-wrapper">
            <ion-input 
              formControlName="password" 
              [type]="showPassword ? 'text' : 'password'" 
              placeholder="{{'PASSWORD_PLACEHOLDER'|translate}}" 
              mode="md" 
              fill="outline">
              <ion-button slot="end" fill="clear" (click)="showPassword = !showPassword" class="password-toggle">
                <ion-icon [name]="showPassword ? 'eye-off' : 'eye'" slot="icon-only"></ion-icon>
              </ion-button>
            </ion-input>
          </div>
        </div>
        <div class="agreement-box">
          <p class="info-text">{{'INFORMATION_TEXT'|translate}}</p>
          
          <ion-item lines="none" class="check-item">
            <ion-checkbox formControlName="kvkkCheck" slot="start"></ion-checkbox>
            <ion-label>{{'KVKK_AGREEMENT'|translate}}</ion-label>
          </ion-item>

          <ion-item lines="none" class="check-item">
            <ion-checkbox formControlName="marketingCheck" slot="start"></ion-checkbox>
            <ion-label>{{'MARKETING_AGREEMENT'|translate}}</ion-label>
          </ion-item>
        </div>

        <ion-button type="submit" [disabled]="!registerForm.valid" expand="block" color="success" class="main-btn" shape="round">
          {{'SIGN_UP'|translate}}
        </ion-button>

        <div class="footer-links ion-text-center">
          <p>{{'DO_YOU_HAVE_ACCOUNT'|translate}}? <a (click)="goToLogin()">{{'LOGIN'|translate}}</a></p>
        </div>
      </div>
    </div>


  </form>

</ion-content>
