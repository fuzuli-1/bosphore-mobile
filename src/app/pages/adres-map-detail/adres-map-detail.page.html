<ion-header>
  <ion-toolbar>
    <ion-title> {{ 'ADDRESS_DETAILS' | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">Kapat</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-label position="stacked"> {{ 'ADDRESS_TITLE' | translate }}</ion-label>
      <ion-input [(ngModel)]="address.title" placeholder="Evim"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked"> {{ 'OPEN_ADDRESS' | translate }}</ion-label>
      <ion-textarea [(ngModel)]="address.addressText" readonly></ion-textarea>
    </ion-item>

    <ion-row>
      <ion-col size="6">
        <ion-item>
          <ion-label position="stacked"> {{ 'BUILDING_NUMBER' | translate }}</ion-label>
          <ion-input [(ngModel)]="address.buildingNo"></ion-input>
        </ion-item>
      </ion-col>
      <ion-col size="6">
        <ion-item>
          <ion-label position="stacked"> {{ 'FLOOR_AND_APARTMENT' | translate }}</ion-label>
          <ion-input [(ngModel)]="address.floorAndApartment"></ion-input>
        </ion-item>
      </ion-col>
    </ion-row>

    <ion-item>
      <ion-label position="stacked"> {{ 'ADDRESS_DESCRIPTION' | translate }}</ion-label>
      <ion-input [(ngModel)]="address.description" placeholder="Zile basmayın..."></ion-input>
    </ion-item>
  </ion-list>

  <ion-button expand="block" color="success" (click)="saveAddress()" class="ion-margin-top">
     {{ 'SAVE_AND_CONTINUE' | translate }}
  </ion-button>
</ion-content>
