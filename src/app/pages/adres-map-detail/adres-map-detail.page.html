<ion-header>
  <ion-toolbar>
    <ion-title>Adres Detayları</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">Kapat</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-label position="stacked">Adres Başlığı (Örn: Ev, İş)</ion-label>
      <ion-input [(ngModel)]="address.title" placeholder="Evim"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Açık Adres (Haritadan Gelen)</ion-label>
      <ion-textarea [(ngModel)]="address.addressText" readonly></ion-textarea>
    </ion-item>

    <ion-row>
      <ion-col size="6">
        <ion-item>
          <ion-label position="stacked">Bina No</ion-label>
          <ion-input [(ngModel)]="address.buildingNo"></ion-input>
        </ion-item>
      </ion-col>
      <ion-col size="6">
        <ion-item>
          <ion-label position="stacked">Kat / Daire</ion-label>
          <ion-input [(ngModel)]="address.floorAndApartment"></ion-input>
        </ion-item>
      </ion-col>
    </ion-row>

    <ion-item>
      <ion-label position="stacked">Adres Tarifi (Opsiyonel)</ion-label>
      <ion-input [(ngModel)]="address.description" placeholder="Zile basmayın..."></ion-input>
    </ion-item>
  </ion-list>

  <ion-button expand="block" color="success" (click)="saveAddress()" class="ion-margin-top">
    Kaydet ve Devam Et
  </ion-button>
</ion-content>
